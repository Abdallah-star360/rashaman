[build]
  publish = "."

# ============ رؤوس الأمان ============
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"

# ============ Cache للملفات الثابتة ============
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============ إعادة التوجيه ============
# الجذر يعرض النسخة العربية
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# دعم الروابط بدون .html
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false

# إذا الصفحة غير موجودة، اعرض النسخة العربية
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404